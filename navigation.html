<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Navigation Bar</title>
    <link rel="stylesheet" href="./navigation.css"/>
</head>
<body>
    <nav class="menu">
        <div class="logoAndSearch">
            <img src="./logo/official-linkedin-logo----17.png" alt="LinkedIn Logo" id="logo" />
            <input type="text" placeholder="&#x1F50D; Search" />
        </div>
        <div class="primaryMenu">
            <div class="icons" id="home">
                <img src="./icons/home.svg" alt="Home icon" id="homeIcon"/>
                <h5>Home</h5>
            </div>
            <div class="icons" id="people">
                <img src="./icons/people.svg" alt="Home icon" id="peopleIcon"/>
                <h5>My Network</h5>
                <h6>4</h6>
            </div>
            <div class="icons" id="jobs">
                <img src="./icons/briefcase.svg" alt="Home icon" id="briefCaseIcon"/>
                <h5>Jobs</h5>
            </div>
            <div class="icons" id="messaging">
                <img src="./icons/chatbubble-ellipses.svg" alt="Home icon" id="messageIcon"/>
                <h5>Messaging</h5>
            </div>
            <div class="icons" id="notification">
                <img src="./icons/notifications.svg" alt="Home icon" id="notificationIcon"/>
                <h5>Notifications</h5>
            </div>
            <div class="icons" id="profile">
                <img src="./icons/person-circle.svg" alt="Home icon" id="personIcon"/>
                <div class="profileCaret">
                    <h5>Me</h5>
                    <img id="caretDown" src="./icons/caret-down.svg" alt="caret down icon"/>
                </div>
            </div>
            <div class="icons" id="business">
                <img src="./icons/apps.svg" alt="Home icon" id="businessIcon"/>
                <div class="businessCaret">
                    <h5>For Business</h5>
                    <img id="caretDown" src="./icons/caret-down.svg" alt="caret down icon"/>
                </div>
            </div>
            <div class="icons" id="premium">
                <img src="./icons/square.svg" alt="Home icon" id="squareIcon"/>
                <h5>Retry Premium</h5>
            </div>
        </div>
    </nav>
    <main>

    </main>

</body>
</html>
